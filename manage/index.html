<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYLA - Atelier | Gestion du catalogue</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src https://api.citetome.com">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    body {
      background: var(--dark);
      color: var(--stone);
      min-height: 100vh;
    }
    .portal {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 5% 5rem;
    }
    .portal-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .portal-brand {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--white);
    }
    .portal-brand-sub {
      font-size: 0.55rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--gold-muted);
      margin-top: 0.3rem;
    }
    .portal-title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 400;
      color: var(--gold);
      margin-top: 2rem;
      letter-spacing: 0.1em;
    }
    .portal-subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
    }
    .portal-card {
      background: var(--charcoal);
      border: 0.5px solid rgba(184,149,106,0.25);
      border-radius: 2px;
      padding: 2rem;
    }
    .portal-label {
      display: block;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }
    .portal-sublabel {
      display: block;
      font-size: 0.6rem;
      font-weight: 300;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }
    .portal-input,
    .portal-select,
    .portal-textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.04);
      border: 0.5px solid rgba(255,255,255,0.15);
      border-radius: 2px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--white);
      outline: none;
      transition: border-color 0.3s;
    }
    .portal-input:focus,
    .portal-select:focus,
    .portal-textarea:focus { border-color: var(--gold); }
    .portal-select { appearance: none; }
    .portal-select option { background: var(--charcoal); color: var(--white); }
    .portal-textarea { resize: vertical; min-height: 80px; }
    .portal-field { margin-bottom: 1.4rem; }
    .portal-btn {
      display: inline-block;
      padding: 0.95rem 2.2rem;
      background: var(--gold);
      border: 0.5px solid var(--gold);
      border-radius: 2px;
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .portal-btn:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
    .portal-btn:disabled { opacity: 0.5; cursor: wait; }
    .portal-btn-ghost {
      background: transparent;
      color: var(--gold);
    }
    .portal-btn-ghost:hover { background: var(--gold); color: var(--white); }
    .portal-msg {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--stone);
      min-height: 1.2rem;
    }
    .portal-msg.error { color: #D88A7A; }
    .portal-msg.success { color: var(--gold-light); }
    .portal-msg a { color: var(--gold); border-bottom: 0.5px solid var(--gold); }
    .portal-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 0.5px solid rgba(255,255,255,0.08);
    }
    .portal-row:last-child { border-bottom: none; }
    .portal-thumb {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 2px;
      object-fit: cover;
      background: rgba(255,255,255,0.06);
    }
    .portal-thumb-empty {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      border-radius: 2px;
      background: rgba(184,149,106,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--gold);
    }
    .portal-row-main { flex: 1; min-width: 0; }
    .portal-row-name {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .portal-row-meta {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .portal-row-price {
      font-size: 0.8rem;
      font-weight: 300;
      color: var(--gold-light);
      white-space: nowrap;
    }
    .portal-edit-btn {
      padding: 0.5rem 1.1rem;
      background: transparent;
      border: 0.5px solid var(--gold);
      border-radius: 1px;
      color: var(--gold);
      font-family: var(--font-body);
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }
    .portal-edit-btn:hover { background: var(--gold); color: var(--white); }
    .portal-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .portal-logout {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.3s;
    }
    .portal-logout:hover { color: var(--gold); }
    .portal-preview {
      max-width: 200px;
      max-height: 200px;
      border-radius: 2px;
      margin-top: 0.8rem;
      display: none;
    }
    .portal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    .portal-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem;
    }
    @media (max-width: 540px) {
      .portal-grid-2 { grid-template-columns: 1fr; gap: 0; }
      .portal-card { padding: 1.4rem; }
      .portal-row-price { display: none; }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="portal">
    <header class="portal-header">
      <div class="portal-brand">AYLA</div>
      <div class="portal-brand-sub">Esprit D'Elegance</div>
      <h1 class="portal-title">Atelier - Gestion du catalogue</h1>
      <p class="portal-subtitle">Catalogue management portal</p>
    </header>

    <!-- ═══ Login ═══ -->
    <section id="viewLogin" class="portal-card hidden">
      <form id="loginForm">
        <div class="portal-field">
          <label class="portal-label" for="loginCode">Code d'acces</label>
          <span class="portal-sublabel">Access code</span>
          <input type="password" id="loginCode" class="portal-input" autocomplete="current-password" required>
        </div>
        <button type="submit" class="portal-btn" id="loginBtn">Entrer</button>
        <p class="portal-msg" id="loginMsg"></p>
      </form>
    </section>

    <!-- ═══ Product list ═══ -->
    <section id="viewList" class="hidden">
      <div class="portal-toolbar">
        <button class="portal-btn" id="addBtn">+ Ajouter une piece</button>
        <button class="portal-logout" id="logoutBtn">Deconnexion</button>
      </div>
      <div class="portal-card">
        <div id="productList"></div>
        <p class="portal-msg" id="listMsg"></p>
      </div>
    </section>

    <!-- ═══ Add / edit form ═══ -->
    <section id="viewForm" class="hidden">
      <div class="portal-card">
        <form id="productForm">
          <div class="portal-field">
            <label class="portal-label" for="fNom">Nom</label>
            <span class="portal-sublabel">Name</span>
            <input type="text" id="fNom" class="portal-input" required>
          </div>
          <div class="portal-grid-2">
            <div class="portal-field">
              <label class="portal-label" for="fCollection">Collection</label>
              <span class="portal-sublabel">Collection</span>
              <select id="fCollection" class="portal-select">
                <option value="Luna">Luna</option>
                <option value="Sahara">Sahara</option>
                <option value="Noor">Noor</option>
              </select>
            </div>
            <div class="portal-field">
              <label class="portal-label" for="fCategorie">Categorie</label>
              <span class="portal-sublabel">Category</span>
              <select id="fCategorie" class="portal-select">
                <option value="necklaces">Colliers (necklaces)</option>
                <option value="rings">Bagues (rings)</option>
                <option value="earrings">Boucles d'oreilles (earrings)</option>
                <option value="bracelets">Bracelets (bracelets)</option>
              </select>
            </div>
          </div>
          <div class="portal-grid-2">
            <div class="portal-field">
              <label class="portal-label" for="fPrix">Prix (MAD)</label>
              <span class="portal-sublabel">Price in MAD</span>
              <input type="number" id="fPrix" class="portal-input" min="0" step="1" required>
            </div>
            <div class="portal-field">
              <label class="portal-label" for="fPoids">Poids</label>
              <span class="portal-sublabel">Weight, e.g. 2.8g</span>
              <input type="text" id="fPoids" class="portal-input" placeholder="2.8g">
            </div>
          </div>
          <div class="portal-field">
            <label class="portal-label" for="fMateriaux">Materiaux</label>
            <span class="portal-sublabel">Materials</span>
            <input type="text" id="fMateriaux" class="portal-input" placeholder="925 Sterling Silver">
          </div>
          <div class="portal-field">
            <label class="portal-label" for="fDesc">Description courte</label>
            <span class="portal-sublabel">Short description</span>
            <textarea id="fDesc" class="portal-textarea"></textarea>
          </div>
          <div class="portal-field">
            <label class="portal-label" for="fPhoto">Photo</label>
            <span class="portal-sublabel">Photo (JPEG, redimensionnee automatiquement / resized automatically)</span>
            <input type="file" id="fPhoto" class="portal-input" accept="image/*">
            <img id="photoPreview" class="portal-preview" alt="Apercu de la photo">
          </div>
          <div class="portal-actions">
            <button type="submit" class="portal-btn" id="publishBtn">Publier</button>
            <button type="button" class="portal-btn portal-btn-ghost" id="cancelBtn">Annuler</button>
          </div>
          <p class="portal-msg" id="formMsg"></p>
        </form>
      </div>
    </section>
  </div>

  <script>
    'use strict';

    var API_BASE = 'https://api.citetome.com/portal/ayla';
    var TOKEN_KEY = 'ayla_portal_token';

    var products = [];          // verbatim objects from the API (unknown fields preserved)
    var editingIndex = -1;      // -1 = new product
    var pendingImageB64 = null; // base64 (no data: prefix) of a freshly chosen photo
    var pendingImageDataUrl = null;

    function $(id){ return document.getElementById(id); }

    function show(view){
      ['viewLogin','viewList','viewForm'].forEach(function(v){
        $(v).classList.toggle('hidden', v !== view);
      });
    }

    function setMsg(id, text, kind){
      var el = $(id);
      el.textContent = text || '';
      el.className = 'portal-msg' + (kind ? ' ' + kind : '');
    }

    function token(){ return localStorage.getItem(TOKEN_KEY) || ''; }

    function api(path, options){
      options = options || {};
      options.headers = options.headers || {};
      options.headers['X-Portal-Token'] = token();
      if (options.body) { options.headers['Content-Type'] = 'application/json'; }
      return fetch(API_BASE + path, options).then(function(r){
        if (r.status === 401) {
          var err = new Error('unauthorized');
          err.unauthorized = true;
          throw err;
        }
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      });
    }

    function slugify(name){
      return String(name).toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    // ── Login ──
    $('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      var code = $('loginCode').value.trim();
      if (!code) { return; }
      localStorage.setItem(TOKEN_KEY, code);
      setMsg('loginMsg', 'Verification...', '');
      $('loginBtn').disabled = true;
      loadProducts().finally(function(){ $('loginBtn').disabled = false; });
    });

    $('logoutBtn').addEventListener('click', function(){
      localStorage.removeItem(TOKEN_KEY);
      $('loginCode').value = '';
      setMsg('loginMsg', '');
      show('viewLogin');
    });

    // ── Product list ──
    function loadProducts(){
      return api('/products', { method: 'GET' })
        .then(function(data){
          products = Array.isArray(data) ? data : (data && data.products) || [];
          renderList();
          show('viewList');
          setMsg('loginMsg', '');
        })
        .catch(function(err){
          if (err.unauthorized) {
            localStorage.removeItem(TOKEN_KEY);
            show('viewLogin');
            setMsg('loginMsg', 'Code invalide.', 'error');
          } else {
            show('viewLogin');
            setMsg('loginMsg', 'Connexion impossible pour le moment. Reessayez dans un instant. (Connection failed, please retry.)', 'error');
          }
        });
    }

    function renderList(){
      var box = $('productList');
      box.innerHTML = '';
      if (!products.length) {
        setMsg('listMsg', 'Aucune piece pour le moment. Ajoutez votre premiere creation. (No products yet.)');
        return;
      }
      setMsg('listMsg', '');
      products.forEach(function(p, i){
        var row = document.createElement('div');
        row.className = 'portal-row';

        var thumb;
        if (p.image) {
          thumb = document.createElement('img');
          thumb.className = 'portal-thumb';
          thumb.src = p.image;
          thumb.alt = p.name || '';
          thumb.loading = 'lazy';
        } else {
          thumb = document.createElement('div');
          thumb.className = 'portal-thumb-empty';
          thumb.textContent = 'AYLA';
        }
        row.appendChild(thumb);

        var main = document.createElement('div');
        main.className = 'portal-row-main';
        var nameEl = document.createElement('div');
        nameEl.className = 'portal-row-name';
        nameEl.textContent = p.name || '(sans nom)';
        var metaEl = document.createElement('div');
        metaEl.className = 'portal-row-meta';
        metaEl.textContent = (p.collection || '') + (p.category ? ' / ' + p.category : '');
        main.appendChild(nameEl);
        main.appendChild(metaEl);
        row.appendChild(main);

        var price = document.createElement('div');
        price.className = 'portal-row-price';
        price.textContent = (p.price_mad != null ? Number(p.price_mad).toLocaleString('en-US') : '-') + ' MAD';
        row.appendChild(price);

        var btn = document.createElement('button');
        btn.className = 'portal-edit-btn';
        btn.type = 'button';
        btn.textContent = 'Modifier';
        btn.addEventListener('click', function(){ openForm(i); });
        row.appendChild(btn);

        box.appendChild(row);
      });
    }

    // ── Add / edit form ──
    $('addBtn').addEventListener('click', function(){ openForm(-1); });
    $('cancelBtn').addEventListener('click', function(){
      show('viewList');
      setMsg('formMsg', '');
    });

    function openForm(index){
      editingIndex = index;
      pendingImageB64 = null;
      pendingImageDataUrl = null;
      $('productForm').reset();
      $('photoPreview').style.display = 'none';
      $('photoPreview').removeAttribute('src');
      setMsg('formMsg', '');

      if (index >= 0) {
        var p = products[index];
        $('fNom').value = p.name || '';
        $('fCollection').value = p.collection || 'Luna';
        $('fCategorie').value = p.category || 'necklaces';
        $('fPrix').value = p.price_mad != null ? p.price_mad : '';
        $('fMateriaux').value = p.materials || '';
        $('fPoids').value = p.weight || '';
        $('fDesc').value = p.description_short || '';
        if (p.image) {
          $('photoPreview').src = p.image;
          $('photoPreview').style.display = 'block';
        }
      }
      show('viewForm');
    }

    // ── Photo: client-side resize to max 1600px, JPEG ~85% ──
    $('fPhoto').addEventListener('change', function(){
      var file = this.files && this.files[0];
      if (!file) { return; }
      setMsg('formMsg', 'Traitement de la photo... (Processing photo...)');
      resizeImage(file).then(function(dataUrl){
        pendingImageDataUrl = dataUrl;
        pendingImageB64 = dataUrl.split(',')[1];
        $('photoPreview').src = dataUrl;
        $('photoPreview').style.display = 'block';
        setMsg('formMsg', '');
      }).catch(function(){
        pendingImageB64 = null;
        pendingImageDataUrl = null;
        setMsg('formMsg', 'Cette photo n\'a pas pu etre lue. Essayez une autre image. (Could not read this photo.)', 'error');
      });
    });

    function resizeImage(file){
      return new Promise(function(resolve, reject){
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function(){
          try {
            var MAX = 1600;
            var w = img.naturalWidth, h = img.naturalHeight;
            if (w > MAX || h > MAX) {
              var scale = Math.min(MAX / w, MAX / h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            var canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL('image/jpeg', 0.85));
          } catch (e) { reject(e); }
        };
        img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
        img.src = url;
      });
    }

    // ── Publish ──
    $('productForm').addEventListener('submit', function(e){
      e.preventDefault();
      var nom = $('fNom').value.trim();
      if (!nom) {
        setMsg('formMsg', 'Le nom est obligatoire. (Name is required.)', 'error');
        return;
      }
      var prix = Number($('fPrix').value);
      if (!isFinite(prix) || prix < 0) {
        setMsg('formMsg', 'Le prix doit etre un nombre valide. (Price must be a valid number.)', 'error');
        return;
      }

      var btn = $('publishBtn');
      btn.disabled = true;
      setMsg('formMsg', 'Publication en cours... (Publishing...)');

      // One atomic publish: products.json + the optional photo land in a
      // single commit on the backend (POST /publish), so the site never
      // references a photo that has not been pushed yet.
      var imagePayload = null;
      var newImageUrl = null;
      if (pendingImageB64) {
        var imageFilename = slugify(nom) + '.jpg';
        imagePayload = { filename: imageFilename, content_base64: pendingImageB64 };
        // Same-origin URL; must match the image_url the backend returns.
        newImageUrl = 'https://aylamaison.com/assets/images/products/' + imageFilename;
      }

      // Preserve every existing/unknown field verbatim; only overwrite edited ones.
      var base = editingIndex >= 0 ? products[editingIndex] : null;
      var updated = {};
      if (base) {
        Object.keys(base).forEach(function(k){ updated[k] = base[k]; });
      } else {
        var maxId = 0;
        products.forEach(function(p){ if (Number(p.id) > maxId) { maxId = Number(p.id); } });
        updated.id = maxId + 1;
        updated.in_stock = true;
      }
      updated.name = nom;
      updated.collection = $('fCollection').value;
      updated.category = $('fCategorie').value;
      updated.price_mad = prix;
      updated.materials = $('fMateriaux').value.trim();
      updated.weight = $('fPoids').value.trim();
      updated.description_short = $('fDesc').value.trim();
      if (newImageUrl) { updated.image = newImageUrl; }

      var nextList = products.slice();
      if (editingIndex >= 0) { nextList[editingIndex] = updated; }
      else { nextList.push(updated); }

      api('/publish', {
        method: 'POST',
        body: JSON.stringify({ products: nextList, image: imagePayload })
      }).then(function(){
        products = nextList;
        pendingImageB64 = null;
        pendingImageDataUrl = null;
        renderList();
        show('viewList');
        setMsg('listMsg',
          'Publie. Le site se met a jour dans 1-2 minutes. ', 'success');
        var link = document.createElement('a');
        link.href = 'https://aylamaison.com/shop.html';
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Voir la boutique';
        $('listMsg').appendChild(link);
      }).catch(function(err){
        if (err.unauthorized) {
          localStorage.removeItem(TOKEN_KEY);
          show('viewLogin');
          setMsg('loginMsg', 'Code invalide.', 'error');
        } else {
          setMsg('formMsg', 'La publication a echoue. Verifiez votre connexion et reessayez. (Publish failed, please retry.)', 'error');
        }
      }).finally(function(){
        btn.disabled = false;
      });
    });

    // ── Boot ──
    if (token()) { loadProducts(); } else { show('viewLogin'); }
  </script>

  <noscript>
    <p style="text-align:center;padding:2rem;font-size:0.85rem;">
      JavaScript est necessaire pour utiliser ce portail. (JavaScript is required to use this portal.)
    </p>
  </noscript>
</body>
</html>
