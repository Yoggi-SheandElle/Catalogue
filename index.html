<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue | Projects by Yossra Benzad</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0D0D0D;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }
    h1 {
      font-size: 3rem;
      font-weight: 200;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6E6E73;
      margin-bottom: 4rem;
    }
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 900px;
      width: 100%;
    }
    .project-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      border-radius: 4px;
      cursor: pointer;
      background: #1D1D1F;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .project-card:hover { transform: scale(1.02); }
    .project-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,0.8) 100%);
      z-index: 1;
    }
    .project-card-bg {
      position: absolute;
      inset: 0;
      transition: transform 1s ease;
    }
    .project-card:hover .project-card-bg { transform: scale(1.08); }
    .project-card-content { position: relative; z-index: 2; }
    .project-label {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #B8956A;
      margin-bottom: 0.5rem;
    }
    .project-name {
      font-size: 1.5rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }
    .project-desc {
      font-size: 0.75rem;
      font-weight: 300;
      color: #A1A1A6;
      line-height: 1.6;
    }
    .project-arrow {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      font-size: 1.2rem;
      color: #B8956A;
      z-index: 2;
      opacity: 0;
      transform: translate(-5px, 5px);
      transition: all 0.4s;
    }
    .project-card:hover .project-arrow {
      opacity: 1;
      transform: translate(0, 0);
    }
    .footer-text {
      margin-top: 4rem;
      font-size: 0.65rem;
      color: #6E6E73;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <h1>Catalogue</h1>
  <p class="subtitle">Projects by Yossra Benzad</p>

  <div class="projects">
    <a href="ayla/index.html" class="project-card">
      <div class="project-card-bg" style="background: linear-gradient(135deg, #2C2420 0%, #5C4A3A 50%, #B8956A 100%);"></div>
      <span class="project-arrow">&nearr;</span>
      <div class="project-card-content">
        <p class="project-label">E-commerce & Brand</p>
        <h2 class="project-name">AYLA - Esprit D'Elegance</h2>
        <p class="project-desc">Premium minimalist jewelry brand. Full website with shop, product catalogue, and brand identity.</p>
      </div>
    </a>

    <a href="#" class="project-card" style="opacity:0.4;pointer-events:none;">
      <div class="project-card-bg" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);"></div>
      <div class="project-card-content">
        <p class="project-label">Coming Soon</p>
        <h2 class="project-name">Next Project</h2>
        <p class="project-desc">More projects in development.</p>
      </div>
    </a>
  </div>

  <p class="footer-text">&copy; 2026 Yossra Benzad. Built with intention.</p>
</body>
</html>
